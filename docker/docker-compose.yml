name: home-flix

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      jellyfin:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Pacific/Auckland}
      - SERVER_HOSTNAME=${SERVER_HOSTNAME:-}
      - SERVER_IP=${SERVER_IP:-}
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/ssd/web-frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - media-net

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      - /mnt/ssd/jellyfin/config:/config
      - /mnt/ssd/jellyfin/cache:/cache
      - /mnt/ssd/media:/media:ro
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - media-net

networks:
  media-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
